version: "3.5"

networks:
  ttit-network:

volumes:
  ttit-vl:

services:
  docker-nginx:
    image: nginx:1.27-alpine
    ports:
      - "8094:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ttit-network
    depends_on:
      - docker-php-fpm

  docker-mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - ttit-vl:/var/lib/mysql
    networks:
      - ttit-network

  docker-phpmyadmin:
    image: phpmyadmin:5-apache
    ports:
      - "8095:80"
    environment:
      PMA_HOST: docker-mariadb
      PMA_USER: root
      PMA_PASSWORD: root
    networks:
      - ttit-network
    depends_on:
      - docker-mariadb

  docker-php-fpm:
    build: ./php-fpm
    volumes:
      - ./:/var/www/html
    networks:
      - ttit-network
